services:
  - type: web
    name: Health Goat Monitoring System
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        value: "goat-monitor-secret-key"
      - key: DATABASE_URL
        value: "sqlite:///goat_monitor.db"
