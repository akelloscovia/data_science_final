services:
  - type: web
    name: health-goat-monitoring
    env: python
    plan: free
    runtime: python-3.11
    build:
      command: pip install -r requirements.txt
    start:
      command: gunicorn run:app --bind 0.0.0.0:${PORT}
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///goat_monitor.db"
